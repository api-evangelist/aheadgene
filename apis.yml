aid: aheadgene
name: AheadGene
description: >-
  AheadGene (Sichuan AheadGene Biotechnology Co., Ltd. / 四川艾合智兴生物科技有限公司) is a synthetic
  biology company founded in 2021 and headquartered in Chengdu, Sichuan, China. The company
  engineers non-natural protein functions — "bioworks beyond nature" — and applies them to
  pharmaceutical and chemical manufacturing, with the stated ambition of becoming a full
  industry-chain platform business spanning enzyme and protein design through to production.
  Its public web presence is a single static Chinese-language landing page at www.aheadgene.com
  linking to an internal management console at system.aheadgene.com; the company publishes no
  developer portal, API documentation, SDKs or machine-readable contracts of any kind.
